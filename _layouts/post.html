---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="post-meta">{{ page.date | date: "%d %B %Y" }}{% if page.tags %} · {{ page.tags | join: ", " }}{% endif %}</p>
  {{ content }}
  <p class="back"><a href="{{ '/blog/' | relative_url }}">← All posts</a></p>
</article>
